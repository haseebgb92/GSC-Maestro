[package]
name = "gsc-maestro"
version = "1.0.0"
description = "GSC Maestro local-first SEO intelligence desktop application"
authors = ["Advertpreneur"]
edition = "2021"

[lib]
name = "gsc_maestro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.12.1", features = ["json"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
url = "2.5"
urlencoding = "2.1"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
